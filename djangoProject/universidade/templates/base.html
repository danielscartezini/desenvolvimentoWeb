{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nome do Projeto{% endblock %}</title>
    <style>
        /* Variáveis do Modo Claro */
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --accent-color: #ff6600; /* Laranja */
            --header-bg: #f8f9fa;
            --footer-bg: #f8f9fa;
            --border-color: #dddddd;
        }

        /* Variáveis do Modo Escuro */
        [data-theme="dark"] {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #ff6600; /* Laranja */
            --header-bg: #111111;
            --footer-bg: #111111;
            --border-color: #333333;
        }

        /* Estilos Globais */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--header-bg);
            border-bottom: 3px solid var(--accent-color);
        }
        .logo {
            height: 40px; /* Ajuste o tamanho da sua logo */
            margin-right: 15px;
        }
        .project-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
        }
        .nav-links {
            display: flex;
            gap: 20px;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: bold;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: var(--accent-color);
        }
        .theme-toggle {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .theme-toggle:hover {
            background-color: #e65c00;
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 2rem;
        }

        /* Footer */
        footer {
            background-color: var(--footer-bg);
            text-align: center;
            padding: 1rem;
            border-top: 2px solid var(--accent-color);
        }
        .footer-text {
            font-size: 0.75rem; /* Tamanho pequeno */
            color: var(--text-color);
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <img src="{% static 'img/logo.png' %}" alt="Logo" class="logo">
        <span class="project-name">Asimov</span>
    </header>

    <!-- Navbar -->
    {% include "menu.html" %}

    <!-- Conteúdo Dinâmico (onde as outras páginas serão injetadas) -->
    <main>
        {% block conteudo %}
            


        {% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <p class="footer-text">Yuri Macedo Bolis</p>
    </footer>

    <!-- Script para controle de Tema -->
    <script>
        // Verifica a preferência salva no carregamento
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        });

        // Função de alternância
        function toggleTheme() {
            const root = document.documentElement;
            const currentTheme = root.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            root.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }
    </script>
</body>
</html>
