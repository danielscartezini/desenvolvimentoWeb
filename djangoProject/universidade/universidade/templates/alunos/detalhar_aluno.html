{% extends 'base.html' %}

{% block content %}

    <h1>{{ aluno.nome }}</h1>

    <p><strong>E-mail: </strong>{{ aluno.email }}</p>
    <p><strong>Matrícula: </strong>{{ aluno.matricula }}</p>

    <br><br>
    {% if aluno.solicitacoes.all %}
        <h2>Solicitações</h2>
        <ul>
            {% for s in aluno.solicitacoes.all %}
                <li>{{ s.titulo }} - {{ s.data }}</li>
            {% endfor %}
        </ul>
    {% endif %}

{% endblock %}
